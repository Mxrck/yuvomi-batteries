# Local Yuvomi 2.94.0 for developing the batteries module. Never point it at production data.
#
#   docker compose -f docker-compose.dev.yml up -d   start (no image is built)
#   ./scripts/dev-setup.sh                           seed admin + one member (password batteries-dev)
#   docker compose -f docker-compose.dev.yml logs -f batteries-api
#   docker compose -f docker-compose.dev.yml down    stop and remove the containers
#
# One origin, http://localhost:3300:
#   caddy          /api/extensions/batteries/* -> sidecar, everything else -> Yuvomi
#   yuvomi         the official image, pinned like the Umbrel app; ./.dev/modules is its modules
#                  folder, empty at first: copy modules/batteries into it to test a hand install
#   batteries-api  the sidecar straight from ./service on node:24-slim (no image of our own)
#
# Everything the containers write lands in ./.dev (git-ignored), owned by uid 1000.
name: yuvomi-batteries-dev

services:
  caddy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      - yuvomi
      - batteries-api

  yuvomi:
    image: ghcr.io/ulsklyc/yuvomi:2.94.0@sha256:7bdba393749c5c9c11185e7292e04342d6d443216497f4cdccdbbfcca6802622
    restart: unless-stopped
    volumes:
      - ./.dev/modules:/app/modules
      - ./.dev/data:/data
      - ./.dev/backups:/backups
    environment:
      NODE_ENV: production
      DB_PATH: /data/yuvomi.db
      BACKUP_DIR: /backups
      MODULES_DIR: /app/modules
      MODULES_ALLOW_WEB_INSTALL: "true"
      # Dev-only secret for a localhost instance; never reuse it anywhere else.
      SESSION_SECRET: dev-only-batteries-6b1e2f9a4c7d0e3b8a5f1c2d9e6b3a70f4c8e1d2
      # Plain HTTP behind one proxy hop (production has SESSION_SECURE=true behind HTTPS).
      SESSION_SECURE: "false"
      TRUST_PROXY: "1"
      TZ: America/Merida
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  batteries-api:
    image: node:24-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /app
    command: ["node", "--disable-warning=ExperimentalWarning", "service/app/server.mjs"]
    volumes:
      - ./service:/app/service:ro
      - ./.dev/sidecar:/data
    environment:
      PORT: "3100"
      DB_PATH: /data/batteries.db
      YUVOMI_INTERNAL_URL: http://yuvomi:3000
      PUBLIC_ORIGIN: http://localhost:3300
      HOUSEHOLD_TZ: America/Merida
